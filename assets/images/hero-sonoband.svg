<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1f27"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#4a80f0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4a80f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="126" r="150" fill="url(#glow)"/>

  <!-- Straps -->
  <rect x="164" y="18"  width="72" height="46" rx="14" fill="#1a1a22" stroke="#3d3d4d" stroke-width="2"/>
  <rect x="164" y="236" width="72" height="46" rx="14" fill="#1a1a22" stroke="#3d3d4d" stroke-width="2"/>
  <rect x="172" y="18"  width="56" height="10" rx="4" fill="#26262f"/>
  <rect x="172" y="272" width="56" height="10" rx="4" fill="#26262f"/>

  <!-- Watch body -->
  <rect x="122" y="58" width="156" height="184" rx="34" fill="#26262f" stroke="#3d3d4d" stroke-width="2.5"/>
  <rect x="140" y="76" width="120" height="148" rx="20" fill="#0e0e12" stroke="#2e2e3a" stroke-width="1.5"/>

  <!-- Side button -->
  <rect x="276" y="120" width="8" height="26" rx="4" fill="#3d3d4d"/>

  <!-- Screen content: sound-wave bars -->
  <g stroke="#4a80f0" stroke-width="6" stroke-linecap="round">
    <line x1="164" y1="150" x2="164" y2="130"/>
    <line x1="180" y1="155" x2="180" y2="110"/>
    <line x1="196" y1="158" x2="196" y2="92"/>
    <line x1="212" y1="155" x2="212" y2="110"/>
    <line x1="228" y1="150" x2="228" y2="130"/>
  </g>

  <!-- Bell glyph -->
  <path d="M200 178c-8 0-13 6-13 13v6l-4 6h34l-4-6v-6c0-7-5-13-13-13z" fill="#4a80f0" opacity="0.9"/>
  <circle cx="200" cy="206" r="3" fill="#4a80f0" opacity="0.9"/>

  <!-- Brand label -->
  <text x="200" y="228" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#70708a">SONOBAND</text>
</svg>
