<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1f27"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>

  <!-- Detection rings -->
  <circle cx="200" cy="150" r="128" fill="none" stroke="#4a80f0" stroke-width="1.5" opacity="0.18"/>
  <circle cx="200" cy="150" r="96"  fill="none" stroke="#4a80f0" stroke-width="1.5" opacity="0.28"/>
  <circle cx="200" cy="150" r="64"  fill="none" stroke="#4a80f0" stroke-width="1.5" opacity="0.4"/>

  <!-- Zoomed watch face -->
  <rect x="112" y="62" width="176" height="176" rx="36" fill="#26262f" stroke="#3d3d4d" stroke-width="3"/>
  <rect x="132" y="82" width="136" height="136" rx="22" fill="#0e0e12" stroke="#2e2e3a" stroke-width="1.5"/>

  <!-- Equalizer bars -->
  <g stroke="#4a80f0" stroke-width="8" stroke-linecap="round">
    <line x1="160" y1="165" x2="160" y2="135"/>
    <line x1="180" y1="172" x2="180" y2="110"/>
    <line x1="200" y1="178" x2="200" y2="86"/>
    <line x1="220" y1="172" x2="220" y2="110"/>
    <line x1="240" y1="165" x2="240" y2="135"/>
  </g>

  <!-- Small label -->
  <text x="200" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#b0b0c0">LISTENING</text>
</svg>
