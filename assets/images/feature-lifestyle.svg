<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1f27"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
    <linearGradient id="wrist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a46"/>
      <stop offset="100%" stop-color="#26262f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg4)"/>

  <!-- Wrist / forearm silhouette -->
  <path d="M-20 250 C 60 200, 140 190, 220 210 C 300 228, 360 240, 420 224 L 420 340 L -20 340 Z"
        fill="url(#wrist)"/>

  <!-- Strap wrapping the wrist -->
  <path d="M120 168 C 150 140, 250 140, 280 168 L 280 232 C 250 258, 150 258, 120 232 Z"
        fill="#1a1a22" stroke="#3d3d4d" stroke-width="2"/>

  <!-- Watch body on top of wrist -->
  <rect x="150" y="132" width="100" height="100" rx="24" fill="#26262f" stroke="#3d3d4d" stroke-width="2.5"/>
  <rect x="163" y="145" width="74" height="74" rx="14" fill="#0e0e12" stroke="#2e2e3a" stroke-width="1.5"/>

  <!-- Screen glyph: simple sound bars -->
  <g stroke="#4a80f0" stroke-width="5" stroke-linecap="round">
    <line x1="182" y1="192" x2="182" y2="172"/>
    <line x1="196" y1="196" x2="196" y2="160"/>
    <line x1="210" y1="192" x2="210" y2="172"/>
    <line x1="224" y1="188" x2="224" y2="180"/>
  </g>

  <text x="200" y="272" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#b0b0c0">EVERYDAY WEAR</text>
</svg>
