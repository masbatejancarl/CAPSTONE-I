<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1f27"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>

  <!-- Zoomed watch face -->
  <rect x="112" y="62" width="176" height="176" rx="36" fill="#26262f" stroke="#3d3d4d" stroke-width="3"/>
  <rect x="132" y="82" width="136" height="136" rx="22" fill="#0e0e12" stroke="#2e2e3a" stroke-width="1.5"/>

  <!-- Pulsing alert rings behind bell -->
  <circle cx="200" cy="150" r="46" fill="none" stroke="#e05252" stroke-width="2" opacity="0.25"/>
  <circle cx="200" cy="150" r="32" fill="none" stroke="#e05252" stroke-width="2" opacity="0.4"/>

  <!-- Bell glyph -->
  <path d="M200 122c-15 0-25 11-25 25v12l-8 12h66l-8-12v-12c0-14-10-25-25-25z" fill="#e05252"/>
  <circle cx="200" cy="176" r="6" fill="#e05252"/>

  <!-- Vibration motion lines -->
  <g stroke="#4a80f0" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="100" y1="130" x2="88" y2="122"/>
    <line x1="96" y1="150" x2="82" y2="150"/>
    <line x1="100" y1="170" x2="88" y2="178"/>
    <line x1="300" y1="130" x2="312" y2="122"/>
    <line x1="304" y1="150" x2="318" y2="150"/>
    <line x1="300" y1="170" x2="312" y2="178"/>
  </g>

  <text x="200" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#b0b0c0">ALERT</text>
</svg>
